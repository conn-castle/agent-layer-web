name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for versions.json
        id: versions
        run: |
          if [ -f versions.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "versions.json missing; skipping build and deploy."
          fi

      - name: Stop early (no versions yet)
        if: steps.versions.outputs.exists != 'true'
        run: echo "Skipping deploy until first website publish."

      - name: Setup Node
        if: steps.versions.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.versions.outputs.exists == 'true'
        run: npm ci

      - name: Build site
        if: steps.versions.outputs.exists == 'true'
        run: npm run build

      - name: Upload Pages artifact
        if: steps.versions.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.versions.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
